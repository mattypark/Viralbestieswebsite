    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" text-anchor="middle" filter="url(#glow)">
